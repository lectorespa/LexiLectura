
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Ediciones Críticas e Interactivas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-container">
    <!-- Selector de Obra -->
    <section class="top-controls mb-4">
      <div class="selector-container">
        <label for="selector-obras" class="json-box-title">Seleccionar obra del catálogo:</label>
        <select id="selector-obras" class="select-input">
          <option value="">-- Cargar obra anotada --</option>
        </select>
      </div>
    </section>
  
   <!-- Panel de Carga JSON (Acordeón Cerrado por Defecto) -->
    <details class="json-accordion-container">
      <summary class="json-accordion-summary">Genera y visualiza tus propios textos anotados (JSON)</summary>
      <div class="json-box-container">
        <div class="json-box-header">
          <div class="json-toolbar">
            <button id="btn-sample-json" class="btn btn-secondary" type="button">Cargar Ejemplo</button>
            <button id="btn-clear-json" class="btn btn-danger" type="button">Limpiar</button>
          </div>
        </div>
        <textarea id="json-input" class="json-textarea" placeholder="Pega aquí el JSON generado..."></textarea>
        
        <div class="json-actions">
          <!-- Enlace externo a la herramienta de Gemini -->
          <a href="https://gemini.google.com/gem/1DOSkyIsaEnRUID9CmsrPpVPVb4tjZsV7?usp=sharing" target="_blank" rel="noopener noreferrer" class="btn btn-secondary external-gem-btn">Crea aquí tu propio texto anotado</a>
          
          <!-- Input de archivo oculto y botón de subida local -->
          <input type="file" id="local-json-file" accept=".json" style="display: none;" />
          <button id="btn-upload-local" class="btn btn-secondary" type="button">Sube tu propio texto anotado (.json)</button>
          
          <!-- Botón de renderizado -->
          <button id="btn-load-json" class="btn btn-primary" type="button">Ver texto anotado</button>
        </div>
      </div>
    </details>

    <!-- Filtros de Categorías -->
    <section class="top-controls">
      <div class="filter-header">
        <span class="filter-title">Filtro de Categorías / Capas</span>
        <div class="filter-actions">
          <button id="btn-select-all-cats" class="btn btn-secondary" type="button">Todas</button>
          <button id="btn-deselect-all-cats" class="btn btn-secondary" type="button">Ninguna</button>
        </div>
      </div>
      <div id="category-filter-bar" class="category-filter-bar"></div>
    </section>

    <!-- Cabecera del Documento -->
    <header class="doc-header">
      <h1 id="doc-title">Edición Crítica Interactiva</h1>
      <div class="meta-details">
        <span id="doc-author"></span>
        <span id="doc-period"></span>
        <span id="doc-year"></span>
      </div>
    </header>

    <!-- Selector de Nivel de Anotación -->
    <div class="annotation-level-selector">
      <div class="level-buttons">
        <button class="btn btn-secondary level-btn active" data-level="short" type="button">Lectura Básica</button>
        <button class="btn btn-secondary level-btn" data-level="deep" type="button">Edición Crítica</button>
      </div>
      <span id="levelIndicatorBadge" class="level-badge short-mode">Modo Lectura Básica</span>
    </div>

    <!-- Cuerpo del Texto -->
    <main class="text-card">
      <article id="text-stanzas" class="stanzas-wrapper">
        <p class="loading-state">Pega un JSON en el área superior o pulsa "Cargar Ejemplo".</p>
      </article>
    </main>
  </div>

  <!-- Modal Flotante de Anotaciones -->
  <div id="annotation-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <header class="modal-header">
        <div>
          <span id="modal-category" class="modal-category-badge"></span>
          <h2 id="modal-title" class="modal-title"></h2>
        </div>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Cerrar modal">&times;</button>
      </header>
      <div class="modal-body">
        <div id="modal-definition" class="modal-definition"></div>
        <div id="modal-content" class="modal-content"></div>
        
        <div id="modal-image-wrapper" class="modal-image-wrapper hidden">
          <img id="modal-image" src="" alt="" style="display:none;" />
          <p id="modal-image-caption" class="modal-image-caption"></p>
        </div>

        <div id="modal-links" class="modal-links-container hidden"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
