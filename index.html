
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LexiLectura · Ediciones anotadas interactivas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="main-container">


<!-- Nivel 1: Idioma de la aplicación / UI -->
<div class="ui-header">
  <label for="uiLangSelect">Idioma de la app:</label>
  <select id="uiLangSelect" onchange="cambiarIdiomaInterfaz(this.value)">
    <option value="es" selected>Español</option>
    <option value="en">English</option>
    <option value="no">Norsk</option>
  </select>
</div>
    
<!-- Nivel 2: Opciones de anotación (se muestran antes de procesar el texto) -->
<div class="annotation-config-panel">
  <h3 id="lblConfigTitle">Configuración de la Edición</h3>

  <div class="field">
    <label for="textLangSelect" id="lblTextLang">Texto base (stanzas):</label>
    <select id="textLangSelect">
      <option value="original" selected>Conservar idioma original</option>
      <option value="español">Traducir al Español</option>
      <option value="inglés">Traducir al Inglés</option>
      <option value="francés">Traducir al Francés</option>
    </select>
  </div>

  <div class="field">
    <label for="annotationLangSelect" id="lblAnnotationLang">Idioma de las anotaciones:</label>
    <select id="annotationLangSelect">
      <option value="español" selected>Español</option>
      <option value="inglés">English</option>
      <option value="francés">Français</option>
      <option value="noruego">Norsk</option>
    </select>
  </div>

  <!-- Cajetin de texto para anotar -->
  <button id="btnAnnotate" onclick="generarAnotaciones()">Generar edición anotada</button>
</div>

    
    <div class="ia-generator-block mb-4" data-export-omit style="border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 16px;">
  <label for="plain-text-input" class="json-box-title" style="display:block; margin-bottom:6px;">
    ✨ Generar edición anotada con IA:
  </label>
  <textarea id="plain-text-input" class="json-textarea" placeholder="Pega aquí el texto plano en español o en cualquier otro idioma y pulsa anotar. Gemini Flash es rápido y puede anotar textos más largos de 1000 palabras. Groq es muy rápido pero solo para textos de 700 palabras o menos."></textarea>

  <div class="json-actions" style="margin-top: 10px;">
    <button id="btn-clear-plain-text" class="btn btn-danger" type="button"
            title="Borra el texto pegado en el cajetín (no afecta a la edición anotada en pantalla)">
      🧹 Limpiar texto
    </button>
    <button id="btn-generate-gemini" class="btn btn-primary" type="button" data-proveedor="gemini"
            title="Anota con Gemini Flash (Google)">
      ✨ Anotar con Gemini Flash
    </button>
    <button id="btn-generate-groq" class="btn btn-primary" type="button" data-proveedor="groq"
            title="Anota con Groq (modelos gpt-oss)">
      ✨ Anotar con Groq/Qwen
    </button>
  </div>
</div>
  
  
    <!-- Descarga del HTML autónomo (este bloque no se incluye en el archivo exportado) -->
    <div id="export-html-block" data-export-omit style="border-bottom: 1px solid #e2e8f0; padding-bottom: 16px; margin-bottom: 16px;">
      <div class="json-actions">
        <button id="btn-export-html" class="btn btn-secondary" type="button" disabled
                title="Descarga la edición anotada actual como un único archivo HTML que funciona sin servidor">
          💾 Descargar edición como HTML autónomo
        </button>
        <button id="btn-export-json" class="btn btn-secondary" type="button" disabled
                title="Descarga la edición anotada actual como archivo JSON">
          📄 Descargar edición como JSON
        </button>
      </div>
      <p id="export-status" role="status" aria-live="polite" style="margin: 8px 0 0; font-size: 0.85rem; color: #64748b;">
        Anota o carga una edición para poder descargarla.
      </p>
      <div id="export-fallback" hidden style="margin-top: 10px; padding: 10px 12px; background: #fff8e1; border: 1px solid #f0d78c; border-radius: 6px; font-size: 0.9rem;">
        <p id="export-fallback-msg" style="margin: 0 0 8px;"></p>
        <input type="file" id="export-archivos-locales" multiple accept=".css,.js" />
      </div>
    </div>

    <!-- Selector de Obra -->
    <section class="top-controls mb-4" data-export-omit>
      <div class="selector-container">
        <label for="selector-obras" class="json-box-title">O selecciona una obra del catálogo:</label>
        <select id="selector-obras" class="select-input">
          <option value="">-- Cargar obra anotada --</option>
        </select>
      </div>
    </section>
  
  
    <!-- Filtros de Categorías -->
    <section class="top-controls">
      <div class="filter-header">
        <span class="filter-title">Filtro de Categorías / Capas</span>
        <div class="filter-actions">
          <button id="btn-select-all-cats" class="btn btn-secondary" type="button">Todas</button>
          <button id="btn-deselect-all-cats" class="btn btn-secondary" type="button">Ninguna</button>
        </div>
      </div>
      <div id="category-filter-bar" class="category-filter-bar"></div>
    </section>

    <!-- Cabecera del Documento -->
    <header class="doc-header">
      <h1 id="doc-title">Ediciones anotadas interactivas</h1>
      <div class="meta-details">
        <span id="doc-author"></span>
        <span id="doc-period"></span>
        <span id="doc-year"></span>
      </div>
    </header>

    <!-- Selector de Nivel de Anotación -->
<div class="annotation-level-selector">
  <div class="level-buttons">
    <button class="btn btn-secondary level-btn active" data-level="short" type="button">Lectura Básica (B1+)</button>
    <button class="btn btn-secondary level-btn" data-level="deep" type="button">Lectura Avanzada (C1+)</button>
  </div>
  <span id="levelIndicatorBadge" class="level-badge short-mode">Modo Lectura Básica (Vocabulario B1+)</span>
</div>

    <!-- Cuerpo del Texto -->
    <main class="text-card">
      <article id="text-stanzas" class="stanzas-wrapper">
        <p class="loading-state">Pega un texto arriba y anótalo con IA, o selecciona alguna obra ya anotada del catálogo.</p>
      </article>
    </main>
  </div>

  <!-- Modal Flotante de Anotaciones -->
  <div id="annotation-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <header class="modal-header">
        <div>
          <span id="modal-category" class="modal-category-badge"></span>
          <h2 id="modal-title" class="modal-title"></h2>
        </div>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Cerrar modal">&times;</button>
      </header>
      <div class="modal-body">
        <div id="modal-definition" class="modal-definition"></div>
        <div id="modal-content" class="modal-content"></div>
        
        <div id="modal-image-wrapper" class="modal-image-wrapper hidden">
          <img id="modal-image" src="" alt="" style="display:none;" />
          <p id="modal-image-caption" class="modal-image-caption"></p>
        </div>

        <div id="modal-links" class="modal-links-container hidden"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
