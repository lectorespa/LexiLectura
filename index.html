<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor de Ediciones Críticas e Interactivas</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="main-container">
    <!-- Panel de carga JSON -->
    <section class="json-box-container">
      <div class="json-box-header">
        <span class="json-box-title">Cargar Estructura JSON de Edición Crítica</span>
        <div class="json-toolbar">
          <button id="btn-sample-json" class="btn btn-secondary">Cargar Ejemplo</button>
          <button id="btn-clear-json" class="btn btn-danger">Limpiar</button>
        </div>
      </div>
      <textarea id="json-input" class="json-textarea" placeholder="Pega aquí el JSON generado por el agente..."></textarea>
      <div class="json-actions">
        <button id="btn-load-json" class="btn btn-primary">Renderizar Obra</button>
      </div>
    </section>

    <!-- Filtros de Categorías -->
    <section class="top-controls">
      <div class="filter-header">
        <span class="filter-title">Filtro de Categorías</span>
        <div class="filter-actions">
          <button id="btn-select-all-cats" class="btn btn-secondary">Todas</button>
          <button id="btn-deselect-all-cats" class="btn btn-secondary">Ninguna</button>
        </div>
      </div>
      <div id="category-filter-bar" class="category-filter-bar"></div>
    </section>

    <!-- Cabecera del Documento -->
    <header class="doc-header">
      <h1 id="doc-title">Edición Crítica Interactiva</h1>
      <div class="meta-details">
        <span id="doc-author"></span>
        <span id="doc-period"></span>
        <span id="doc-year"></span>
      </div>
    </header>

    <!-- Selector de Nivel de Anotación -->
    <div class="annotation-level-selector">
      <div class="level-buttons">
        <button class="btn btn-secondary level-btn active" data-level="short" aria-checked="true">Nivel Lectura Básica</button>
        <button class="btn btn-secondary level-btn" data-level="deep" aria-checked="false">Nivel Edición Crítica</button>
      </div>
      <span id="levelIndicatorBadge" class="level-badge short-mode">Modo Lectura Básica</span>
    </div>

    <!-- Cuerpo del Texto -->
    <main class="text-card">
      <article id="text-stanzas" class="stanzas-wrapper">
        <p class="loading-state">Carga una obra pegando el JSON arriba o usando el botón de ejemplo.</p>
      </article>
    </main>
  </div>

  <!-- Modal Flotante de Anotaciones -->
  <div id="annotation-modal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-hidden="true">
    <div class="modal-card">
      <header class="modal-header">
        <div>
          <span id="modal-category" class="modal-category-badge"></span>
          <h2 id="modal-title" class="modal-title"></h2>
        </div>
        <button id="modal-close-btn" class="modal-close-btn" aria-label="Cerrar modal">&times;</button>
      </header>
      <div class="modal-body">
        <div id="modal-definition" class="modal-definition"></div>
        <div id="modal-content" class="modal-content"></div>
        
        <div id="modal-image-wrapper" class="modal-image-wrapper hidden">
          <img id="modal-image" src="" alt="" style="display:none;" />
          <p id="modal-image-caption" class="modal-image-caption"></p>
        </div>

        <div id="modal-links" class="modal-links-container hidden"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
