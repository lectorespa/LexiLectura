name: Generar catalogo automáticamente

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'textos/*.json'
      - '.github/workflows/generate-index.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar catalogo.json desde la carpeta textos
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const textosDir = "./textos";
            if (!fs.existsSync(textosDir)) process.exit(0);

            const files = fs.readdirSync(textosDir).filter(f => f.endsWith(".json") && f !== "catalogo.json");
            
            const indexContent = files.map(file => {
              const filePath = path.join(textosDir, file);
              try {
                let rawData = fs.readFileSync(filePath, "utf8");
                rawData = rawData.replace(/^\uFEFF/, "").trim();
                const data = JSON.parse(rawData);

                const title = data.meta?.title || data.meta?.titulo || data.title || data.titulo || file;
                const author = data.meta?.author || data.meta?.autor || data.author || data.autor || "";

                return { file: file, title: title, author: author };
              } catch (e) {
                return { file: file, title: file, author: "" };
              }
            });

            fs.writeFileSync("./catalogo.js", "window.CATALOGO_DATA = " + JSON.stringify(indexContent, null, 2) + ";");
          '

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo.json
          git commit -m "chore: actualizar catalogo.json [skip ci]" || exit 0
          git push
