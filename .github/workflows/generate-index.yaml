- name: Generar catalogo.js desde la carpeta textos
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            const textosDir = "./textos";
            if (!fs.existsSync(textosDir)) process.exit(0);

            const files = fs.readdirSync(textosDir).filter(f => f.endsWith(".json"));
            
            const indexContent = files.map(file => {
              const filePath = path.join(textosDir, file);
              try {
                let rawData = fs.readFileSync(filePath, "utf8");
                rawData = rawData.replace(/^\uFEFF/, "").trim();
                const data = JSON.parse(rawData);

                const title = data.meta?.title || data.meta?.titulo || data.title || data.titulo || file;
                const author = data.meta?.author || data.meta?.autor || data.author || data.autor || "";

                return { file: file, title: title, author: author };
              } catch (e) {
                return { file: file, title: file, author: "" };
              }
            });

            const jsContent = "window.CATALOGO_OBRAS = " + JSON.stringify(indexContent, null, 2) + ";";
            fs.writeFileSync("./catalogo.js", jsContent);
          '

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo.js
          git commit -m "chore: actualizar catalogo.js [skip ci]" || exit 0
          git push
