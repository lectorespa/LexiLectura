name: Actualizar Catálogo de Obras

on:
  push:
    paths:
      - 'textos/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generar catalogo.cjs
        run: node generate-index.js

      - name: Hacer commit y push del catalogo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add obras-data.js
          
          # Solo hace commit si hay cambios reales en catalogo.js
          if git diff --staged --quiet; then
            echo "No hay cambios en el catálogo."
          else
            git commit -m "auto: actualizar catálogo catalogo.cjs"
            git push origin ${{ github.ref_name }}
          fi
